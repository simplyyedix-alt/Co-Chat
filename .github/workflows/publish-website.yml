name: Publish Co-Chat Publications

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'client/**'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # GitHub Pages keeps a canceled deployment alive briefly. Queue releases so
  # deploy-pages never races an in-progress deployment and returns HTTP 400.
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Supabase public configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL Actions secret"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing VITE_SUPABASE_ANON_KEY Actions secret"; exit 1; }
      - name: Build Co-Chat app
        working-directory: client
        run: npm install --no-audit --no-fund --prefer-offline && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SOCIAL_BACKEND: supabase
          VITE_CHAT_BACKEND: supabase
          VITE_MEDIA_API_URL: ${{ secrets.VITE_MEDIA_API_URL }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - name: Include app in website
        run: |
          cp -r client/dist website/app
      - name: Include Android APK in website
        run: |
          test -s website/downloads/co-chat-android.apk
          echo "Using the committed Android Studio APK so Firebase signing fingerprints remain valid."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Clear stale Pages deployments
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner,
                repo,
                environment: 'github-pages',
                task: 'deploy',
                per_page: 20,
              });
              let active = 0;

              for (const deployment of deployments) {
                if (deployment.sha === context.sha) continue;

                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 5,
                });
                if (statuses.some((status) => status.state === 'in_progress' || status.state === 'queued')) {
                  active += 1;
                  await github.rest.repos.createDeploymentStatus({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                    description: 'Superseded by the latest Co-Chat Pages publish.',
                  });
                  core.info(`Marked stale Pages deployment ${deployment.id} inactive.`);
                }
              }

              if (active === 0) return;
              core.info(`Waiting for GitHub Pages to release ${active} stale deployment lock(s) (attempt ${attempt}/12).`);
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            core.setFailed('GitHub Pages still has an active deployment after waiting 120 seconds.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
